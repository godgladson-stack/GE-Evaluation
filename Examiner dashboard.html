<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examiner Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 0;
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .main-content {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }
    .card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h3 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 10px;
      color: #333;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      background-color: #e9ecef;
    }
    .profile-section {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <h1>Examiner Dashboard</h1>
    </header>

    <div class="main-content">
      <section class="card profile-section">
        <h3>User Information</h3>
        <div class="form-group">
          <label>Examiner ID</label>
          <input type="text" value="20108701" readonly>
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" value="ASOKAN D" readonly>
        </div>
        <div class="form-group">
          <label>Designation / Role</label>
          <input type="text" value="Examiner" readonly>
        </div>
      </section>

      <section class="card">
        <h3>Pending Evaluations</h3>
        <p>No new papers assigned at the moment.</p>
      </section>
    </div>
     }

        function goToNext() {
            window.location.href = "evaluation.html";
        }
  </div>
</body>
</html>
