<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examiner Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 0;
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    h3, h4 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 10px;
      color: #333;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[readonly] {
      background-color: #e9ecef;
    }
    button {
      width: 100%;
      padding: 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <h1>Examiner Profile Details</h1>
    </header>

    <form id="registrationForm" onsubmit="handleRegistration(event)">
      <section class="card profile-section">
        <h3>Personal & Professional Profile Details</h3>
        <div class="form-group">
          <label>Examiner ID</label>
          <input type="text" value="20108701" readonly>
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" value="ASOKAN D" readonly>
        </div>
        <div class="form-group">
          <label>Institution Name</label>
          <input type="text" value="Gladstone Education" readonly>
        </div>
        <div class="form-group">
          <label>Institution Code</label>
          <input type="text" value="INST-2026" readonly>
        </div>
        <div class="form-group">
          <label>Designation / Role</label>
          <input type="text" value="Examiner" readonly>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" value="9444282032" readonly>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="text" value="Example@gmail.com" readonly>
        </div>

        <h4>Bank Details (Editable)</h4>
        <div class="form-group">
          <label>Bank Name</label>
          <input type="text" id="bankName" placeholder="Enter Bank Name" required>
        </div>
        <div class="form-group">
          <label>Bank Branch</label>
          <input type="text" id="bankBranch" placeholder="Enter Branch" required>
        </div>
        <div class="form-group">
          <label>Bank Address</label>
          <input type="text" id="bankAddress" placeholder="Enter Bank Address" required>
        </div>
        <div class="form-group">
          <label>Bank Account Number</label>
          <input type="text" id="accountNumber" placeholder="Enter Account Number" required>
        </div>
        <div class="form-group">
          <label>IFSC Code</label>
          <input type="text" id="ifscCode" placeholder="Enter IFSC Code" required>
        </div>
        <div class="form-group">
          <label>PAN Card Number</label>
          <input type="text" id="panNumber" placeholder="Enter PAN Number" required>
        </div>

        <h4>Change Password</h4>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" placeholder="Enter New Password" required>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm New Password" required>
        </div>

        <button type="submit">Submit Registration</button>
      </section>
    </form>

    <section class="card">
      <h3>Pending Evaluations</h3>
      <p>No new papers assigned at the moment.</p>
    </section>
  </div>

  <script>
    function handleRegistration(event) {
      event.preventDefault();
      
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (newPass !== confirmPass) {
        alert("Password and Confirm Password do not match!");
        return;
      }

      // Store form data or process here
      alert("Registration submitted and password updated successfully!");
      window.location.href = 'evaluation.html';
    }
  </script>
</body>
</html>
