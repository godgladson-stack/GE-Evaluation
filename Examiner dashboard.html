<!DOCTYPE html>
<html>
<head>
    <title>Examiner Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .details-box { border: 1px solid #ccc; padding: 15px; width: 300px; border-radius: 5px; }
        .edit-box { display: none; margin-top: 15px; border: 1px dashed #aaa; padding: 15px; width: 300px; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; margin-top: 15px; }
        img { width: 100px; height: 100px; border-radius: 50%; }
    </style>
</head>
<body>

    <h2>Examiner Dashboard</h2>

    <div class="details-box">
        <h3>Examiner Profile Details</h3>
        <p><img id="examinerPhoto" src="placeholder.jpg" alt="Examiner Photo"></p>
        <p><strong>Name:</strong> <span id="examinerName"></span></p>
        <p><strong>Examiner ID:</strong> <span id="examinerIdDisplay"></span></p>
        <p><strong>OSTE Number:</strong> <span id="examinerOSTE"></span></p>
        <p><strong>Institution Name:</strong> <span id="examinerInstName"></span></p>
        <p><strong>Institution Code:</strong> <span id="examinerInstCode"></span></p>
        <p><strong>Gmail ID:</strong> <span id="examinerEmail"></span></p>
        <p><strong>Assigned Details:</strong> <span id="examinerDetailsDisplay"></span></p>
        <button onclick="showEditForm()">Edit Profile</button>
    </div>

    <div id="editForm" class="edit-box">
        <h3>Edit Profile Details</h3>
        <label>New Details:</label><br>
        <input type="text" id="newDetailsInput"><br>
        <button onclick="saveProfile()">Save Profile</button>
        <button onclick="hideEditForm()">Cancel</button>
    </div>

    <button onclick="goToNext()">Next</button>

    <script>
        const examinerID = localStorage.getItem("loggedInExaminer");
        
        function loadProfile() {
            const examinerDetails = localStorage.getItem("assignedExaminer_" + examinerID);
            document.getElementById("examinerIdDisplay").innerText = examinerID;
            document.getElementById("examinerDetailsDisplay").innerText = examinerDetails || "No details assigned";
            
            // Placeholder values. In a real app, fetch these from localStorage or server.
            document.getElementById("examinerName").innerText = "John Doe";
            document.getElementById("examinerOSTE").innerText = "OSTE12345";
            document.getElementById("examinerInstName").innerText = "Gladson Education";
            document.getElementById("examinerInstCode").innerText = "INST987";
            document.getElementById("examinerEmail").innerText = "johndoe@example.com";
        }

        loadProfile();

        function showEditForm() {
            document.getElementById("editForm").style.display = 'block';
        }

        function hideEditForm() {
            document.getElementById("editForm").style.display = 'none';
        }

        function saveProfile() {
            const newDetails = document.getElementById("newDetailsInput").value;
            if (newDetails) {
                localStorage.setItem("assignedExaminer_" + examinerID, newDetails);
                loadProfile();
                hideEditForm();
            } else {
                alert("Please enter new details.");
            }
        }

        function goToNext() {
            window.location.href = "assigned_papers.html";
        }
    </script>

</body>
</html>
