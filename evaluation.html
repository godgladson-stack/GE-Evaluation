<!DOCTYPE html>
<html>
<head>
    <title>Evaluate Student Paper</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #paperCanvas { border: 1px solid black; cursor: crosshair; background-color: white; display: block; margin-bottom: 20px; }
        .controls, .grading { margin-bottom: 15px; }
        button { padding: 10px 15px; margin-right: 10px; font-size: 16px; cursor: pointer; }
        input[type="number"] { padding: 8px; font-size: 16px; width: 80px; }
    </style>
</head>
<body>
    <h2>Evaluate Student Paper</h2>
    <center>  <div id="assignedPaperDisplay"></div> </center>
   
    <div class="controls">
        <button onclick="setTool('X')">Mark Wrong (X)</button>
        <button onclick="setTool('/')">Mark Correct (/)</button>
        <button onclick="clearMarks()">Clear Marks</button>
    </div>
    <center><canvas id="paperCanvas" width="800" height="1000"></canvas></center>
    <div class="grading">
        <label for="totalMarksInput">Total Marks:</label>
        <input type="number" id="totalMarksInput" placeholder="Enter total marks" onchange="calculateFinalMarks()">
        <br><br>
        <label>Final Marks:</label>
        <span id="finalMarksDisplay">0</span>
        <button onclick="submitEvaluation()">Submit Marks</button>
    </div>

    <script>
        // Check both possible keys for logged in teacher or assigned teacher
        const currentTeacher = localStorage.getItem("loggedInTeacher") || localStorage.getItem("assignedTeacher");
        const paper = localStorage.getItem("assignedPaper_" + currentTeacher) || localStorage.getItem("assignedPaper");
        
        document.getElementById("assignedPaperDisplay").innerText = "Assigned Teacher: " + (currentTeacher || "None") + " | Paper: " + (paper || "No Paper Assigned");

        const canvas = document.getElementById("paperCanvas");
        const ctx = canvas.getContext("2d");
        let currentTool = 'X';
        let xCount = 0;
        let slashCount = 0;

        ctx.strokeStyle = "red";
        ctx.lineWidth = 3;

        // Load image onto canvas if paper exists
        let bgImg = new Image();
        if (paper) {
            bgImg.src = paper;
            bgImg.onload = function() {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            };
        }

        function setTool(tool) { currentTool = tool; }

        function clearMarks() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            if (paper && bgImg.complete) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            }
            xCount = 0;
            slashCount = 0;
            calculateFinalMarks();
        }

        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            drawMark(x, y);
        });

        function drawMark(x, y) {
            ctx.beginPath();
            ctx.strokeStyle = "red";
            ctx.lineWidth = 3;
            if (currentTool === 'X') {
                ctx.moveTo(x - 10, y - 10); ctx.lineTo(x + 10, y + 10);
                ctx.moveTo(x + 10, y - 10); ctx.lineTo(x - 10, y + 10);
                xCount++;
            } else if (currentTool === '/') {
                ctx.moveTo(x + 10, y - 10); ctx.lineTo(x - 10, y + 10);
                slashCount++;
            }
            ctx.stroke();
            calculateFinalMarks();
        }

        function calculateFinalMarks() {
            const totalMarks = parseFloat(document.getElementById("totalMarksInput").value) || 0;
            const deduction = (xCount * 1.0) + (slashCount * 1.5);
            const finalMarks = Math.max(0, totalMarks - deduction);
            document.getElementById("finalMarksDisplay").innerText = finalMarks.toFixed(1);
        }

        function submitEvaluation() {
            const finalMarks = document.getElementById("finalMarksDisplay").innerText;
            localStorage.setItem("studentMarks_" + currentTeacher, finalMarks);
            alert("Evaluation submitted with marks: " + finalMarks);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
