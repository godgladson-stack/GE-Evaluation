<!DOCTYPE html>
<html>
<head>
    <title>Evaluate Student Paper</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #paperCanvas { border: 1px solid black; cursor: crosshair; background-color: white; display: block; margin-bottom: 20px; }
        .controls, .grading { margin-bottom: 15px; }
        button { padding: 10px 15px; margin-right: 10px; font-size: 16px; cursor: pointer; }
        input[type="number"] { padding: 8px; font-size: 16px; width: 80px; }
    </style>
</head>
<body>
    <h2>Evaluate Student Paper</h2>
    <div id="assignedPaperDisplay"></div>
    <div class="controls">
        <button onclick="setTool('X')">Mark Wrong (X)</button>
        <button onclick="setTool('/')">Mark Correct (/)</button>
        <button onclick="clearMarks()">Clear Marks</button>
    </div>
    <canvas id="paperCanvas" width="800" height="1000"></canvas>
    <div class="grading">
        <label for="marksInput">Total Marks:</label>
        <input type="number" id="marksInput" min="0">
        <button onclick="submitEvaluation()">Submit Marks</button>
    </div>

    <script>
        const paper = localStorage.getItem("assignedPaper") || "No Paper Assigned";
        document.getElementById("assignedPaperDisplay").innerText = "Assigned Paper: " + paper;

        const canvas = document.getElementById("paperCanvas");
        const ctx = canvas.getContext("2d");
        let currentTool = 'X';

        ctx.strokeStyle = "red";
        ctx.lineWidth = 3;

        function setTool(tool) { currentTool = tool; }

        function clearMarks() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        canvas.addEventListener("click", (e) => {
            const x = e.offsetX;
            const y = e.offsetY;
            drawMark(x, y);
        });

        function drawMark(x, y) {
            ctx.beginPath();
            if (currentTool === 'X') {
                ctx.moveTo(x - 20, y - 20); ctx.lineTo(x + 20, y + 20);
                ctx.moveTo(x + 20, y - 20); ctx.lineTo(x - 20, y + 20);
            } else if (currentTool === '/') {
                ctx.moveTo(x + 20, y - 20); ctx.lineTo(x - 20, y + 20);
            }
            ctx.stroke();
        }

        function submitEvaluation() {
            const marks = document.getElementById("marksInput").value;
            localStorage.setItem("studentMarks", marks);
            alert("Evaluation submitted with marks: " + marks);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
