<!DOCTYPE html>
<html>
<head>
    <title>EXAMINER 1 Login</title>
</head>
<body>
<center> <h2>EXAMINER Portal</h2>
    <label>Username:</label>
    <br>
    <input type="text" id="username">
    <br>
    <label>Password:</label>
    <br>
    <input type="password" id="password">
    <br>
    <br>
    <button type="button" onclick="checkLogin()">Login</button></center>

    <script>
        function checkLogin() {
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            // குறிப்பிட்ட யூசர்நேம் மற்றும் பாஸ்வேர்டை இங்கே சரிபார்க்கிறோம்
            if (user === "User2601201" && pass === "2601201") {
                // லாகின் செய்த எக்ஸாமினர் ஐடியை சேமிக்கிறோம்
                localStorage.setItem("loggedInExaminer", user);
                
                // எக்ஸாமினர் டேஷ்போர்டு பக்கத்திற்கு ரீடைரக்ட் செய்கிறோம்
                window.location.href = "examiner dashboard.html";
            } else {
                alert("Incorrect username or password!");
            }
        }
    </script>
</body>
</html>
