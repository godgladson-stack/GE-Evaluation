<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 0;
    }
    .dashboard-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    h3 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 10px;
      color: #333;
      margin-top: 0;
    }
    .card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
    }
    input[type="file"], select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-top: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .collapsible {
      background-color: #f7f9fc;
      cursor: pointer;
      padding: 15px;
      width: 100%;
      border: none;
      text-align: left;
      outline: none;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .collapsible:after {
      content: '\25BC';
      font-size: 14px;
    }
    .active:after {
      content: '\25B2';
    }
    .content {
      padding: 15px;
      display: none;
      background-color: white;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <h1>Directorate of Technical Education, Tamil Nadu</h1>
      <p>Directorate of Technical Examinations - 2026</p>
    </header>

    <section class="card">
      <h3>Dashboard Overview</h3>
      <p>Active Examiners: <strong>2</strong> | Pending Papers: <strong>5</strong></p>
    </section>

    <section class="card">
      <button class="collapsible">Manage Papers</button>
      <div class="content">
        <div class="form-group">
          <h3>Upload Student Paper</h3>
          <label>Choose Student Paper</label>
          <input type="file">
          <button style="margin-top: 10px;">Upload Paper</button>
        </div>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;">

        <div class="form-group">
          <h3>Assign Papers</h3>
          <label>Select Examiner</label>
          <select>
            <option>User2601201</option>
          </select>
          <label style="margin-top: 10px;">Select Paper</label>
          <select>
            <option>Paper 1</option>
          </select>
          <button style="margin-top: 10px;">Assign</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    var col = document.getElementsByClassName("collapsible");
    var i;

    for (i = 0; i < col.length; i++) {
      col[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.display === "block") {
          content.style.display = "none";
        } else {
          content.style.display = "block";
        }
      });
    }
  </script>
</body>
</html>
