<!DOCTYPE html>
<html>
<head>
    <title>Teacher 1 Login</title>
</head>
<body>
<center> <h2>Teacher Portal</h2>
    <label>Username:</label>
    <br>
    <input type="text" id="username">
    <br>
    <label>Password:</label>
    <br>
    <input type="password" id="password">
    <br>
    <br>
    <button type="button" onclick="checkLogin()">Login</button></center>

    <script>
        function checkLogin() {
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            if (user === "User2601201" && pass === "2601201") {
                // லாகின் செய்த டீச்சர் ஐடியை சேமிக்கிறோம்
                localStorage.setItem("loggedInTeacher", user);
                
                // அடுத்த பக்கத்திற்கு ரீடைரக்ட் செய்கிறோம்
                window.location.href = "evaluation.html";
            } else {
                alert("Incorrect username or password!");
            }
        }
    </script>
</body>
</html>
